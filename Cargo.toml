[workspace]
resolver = "3"
members = [
    "crates/paddock-core",
    "crates/paddock-bench",
]
exclude = [
    "crates/paddock-fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Nicolas De Nigris <nicolas.denigris91@icloud.com>"]
repository = "https://github.com/ndenigris/PaddockKV"
readme = "README.md"
keywords = ["lsm-tree", "kv-store", "database", "storage", "performance"]
categories = ["database-implementations", "data-structures"]

[workspace.dependencies]
# Internal
paddock-core = { path = "crates/paddock-core" }

# Errors
thiserror = "2"

# Hashing / checksums
# crc32c: Castagnoli polynomial (0x82F63B78) — hardware-accelerated on x86_64
# via `_mm_crc32_u64` and on ARM64 via the CRC32 extension. NOT to be confused
# with crc32fast which implements the zlib/Ethernet polynomial.
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3"] }

# Concurrency primitives (only epoch reclamation + channels)
crossbeam-epoch = "0.9"
crossbeam-channel = "0.5"
arc-swap = "1.7"

# Zero-copy serialization
zerocopy = { version = "0.8", features = ["derive"] }

# Low-level
libc = "0.2"

# Linux-only deps gated behind target_os
io-uring = "0.7"

# Crypto fallback for non-AES-NI platforms
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

# Test / bench
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
loom = "0.7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Tight discipline for an elite portfolio project.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Acceptable noise — silence the worst ergonomic offenders only.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Hard bans on unsafe hygiene only — restriction lints like `unwrap_used` /
# `expect_used` / `panic` are intentionally NOT enabled here. They are
# legitimate idioms in `#[cfg(test)]` and benchmarks; we will revisit if/when
# the engine grows production-grade panic-discipline requirements.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1            # frame pointers + line info for flamegraphs
overflow-checks = false

[profile.bench]
inherits = "release"
debug = 2

[profile.dev]
opt-level = 0
debug = 2
overflow-checks = true
